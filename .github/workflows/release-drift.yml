# Is the newest tag actually on PSGallery?
#
# WHY THIS EXISTS, AND WHY IT NEEDS NO SECRET. Publishing is a local
# `scripts/publish.ps1` run, and the API key rotates, so it cannot be stored
# here and the publish cannot be automated. That is fine -- automating the
# publish was never the real fix. The real failure was not knowing: v0.8.22 and
# v0.8.23 were both committed, tagged and released on GitHub, and neither ever
# reached PSGallery. Every installed copy stayed on 0.8.21 for weeks while a
# `tstyles reset` that deleted hand-made profile settings, and a trash sweep
# that erased styles seconds after promising seven days, sat fixed in git and
# shipped to nobody. Nothing anywhere said so.
#
# PSGallery's published version is PUBLIC. This asks for it, compares it to the
# newest tag, and fails when they differ -- on the tag push itself, and again
# every Monday for as long as it stays true. No key, no secret, nothing to
# rotate.

name: Release drift

on:
  push:
    tags:
      - 'v*'
  schedule:
    # Monday 09:00 UTC. A weekly nag is the right frequency for something whose
    # fix is one command: often enough that a forgotten release is caught in
    # days, rare enough that the mail still gets read.
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  drift:
    name: Tag vs PSGallery
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # tags

      - name: Compare the newest tag with what PSGallery serves
        shell: pwsh
        run: |
          # Only tags shaped vN.N[.N[.N]] are candidates, and the newest is
          # taken from THAT list. `--sort=-v:refname` alone sorts whatever is
          # there, so one tag that is not a version -- a marker on the gifs
          # branch, a `latest`, anything a human adds -- could come out on top
          # and be compared as if it were a release.
          $tag = @(git tag -l 'v*' --sort=-v:refname |
                     Where-Object { $_ -match '^v\d+(\.\d+){1,3}$' }) |
                   Select-Object -First 1
          if (-not $tag) { Write-Host "No version tags yet; nothing to compare."; exit 0 }
          $tagVersion = $tag -replace '^v', ''

          # Read-only, unauthenticated, and allowed to fail: PSGallery being
          # unreachable is not a release problem and must not read as one.
          try {
              $published = (Find-PSResource -Name TerminalStyles -Repository PSGallery -ErrorAction Stop).Version.ToString()
          } catch {
              Write-Host "::warning::Could not reach PSGallery: $($_.Exception.Message)"
              Write-Host "Not treating this as drift."
              exit 0
          }

          Write-Host "newest tag : $tagVersion"
          Write-Host "PSGallery  : $published"

          # TryParse, not a [version] cast. A cast THROWS on anything it cannot
          # read -- a prerelease suffix like 0.9.0-beta1, or a version string
          # PSGallery formats unexpectedly -- and these two lines sit outside
          # the try/catch above, so the throw would fail this job with
          # "Cannot convert value ..." every Monday. That reads like drift and
          # is not: it is this check being unable to answer, which is a warning.
          $pv = $null; $tv = $null
          if (-not [version]::TryParse($published, [ref]$pv) -or
              -not [version]::TryParse($tagVersion, [ref]$tv)) {
              Write-Host "::warning::Could not compare '$published' with '$tagVersion' as versions."
              Write-Host "Not treating this as drift."
              exit 0
          }

          if ($pv -ge $tv) {
              Write-Host "PSGallery is up to date."
              exit 0
          }

          Write-Host "::error::PSGallery is on $published but the newest tag is $tagVersion -- the release has not shipped."
          Write-Host ""
          Write-Host "Nobody is running the fixes in $tagVersion. To publish, from a checkout of the tag:"
          Write-Host "    pwsh ./scripts/publish.ps1"
          Write-Host "It prompts for the API key with hidden input and writes it to neither history nor env."
          Write-Host ""
          Write-Host "This check runs again every Monday until the two agree."
          exit 1

      - name: Every tag, not just the newest
        shell: pwsh
        run: |
          # The step above asks whether the NEWEST tag shipped. It stops asking
          # the moment a later version does: newest tag and Gallery agree again,
          # and a version that was tagged and skipped leaves no trace.
          #
          # That is not hypothetical. v0.8.22 and v0.8.23 -- the incident quoted
          # in this file's own header -- are still not on the Gallery, and this
          # workflow has been green throughout. v0.8.47 joined them: it shipped
          # `tstyles show` and its release notes were never published, so the
          # Gallery, which renders no README, has never mentioned the command.
          #
          # One request lists every published version, so this is a set
          # comparison rather than one call per tag.
          try {
              $published = @(Find-PSResource -Name TerminalStyles -Repository PSGallery -Version '*' -ErrorAction Stop |
                               ForEach-Object { $_.Version.ToString() })
          } catch {
              Write-Host "::warning::Could not reach PSGallery: $($_.Exception.Message)"
              exit 0
          }

          $tags = @(git tag -l 'v*' |
                      Where-Object { $_ -match '^v\d+(\.\d+){1,3}$' } |
                      ForEach-Object { $_ -replace '^v', '' })

          # Versions already known never to have shipped, with what carried
          # their code instead. Anything here is acknowledged, not forgotten.
          # Relative to the checkout, NOT $PSScriptRoot: a pwsh `run:` block is
          # written to a temp file on the runner, so $PSScriptRoot is that temp
          # directory and the lookup would silently find nothing -- turning
          # every recorded gap back into a failure.
          $knownPath = Join-Path $env:GITHUB_WORKSPACE 'docs/unshipped-versions.txt'
          $known = @()
          if (Test-Path -LiteralPath $knownPath) {
              $known = @(Get-Content -LiteralPath $knownPath |
                           Where-Object { $_ -and $_ -notmatch '^\s*#' } |
                           ForEach-Object { ($_ -split '\s+')[0] })
          }

          $gaps = @($tags | Where-Object { $published -notcontains $_ -and $known -notcontains $_ })
          if ($gaps.Count -eq 0) {
              Write-Host "Every tag is on the Gallery, or is recorded in docs/unshipped-versions.txt."
              exit 0
          }

          Write-Host "::error::Tagged but never published, and not recorded: $($gaps -join ', ')"
          Write-Host ""
          Write-Host "The code in a skipped version ships inside the next one published."
          Write-Host "Its RELEASE NOTES do not: the Gallery shows only the notes of the"
          Write-Host "version being viewed, and renders no README, so nobody reads them."
          Write-Host ""
          Write-Host "Either publish it, or carry what its notes said into the next notes"
          Write-Host "you publish and add it to docs/unshipped-versions.txt."
          exit 1
