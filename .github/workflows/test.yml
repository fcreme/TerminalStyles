name: Tests

on:
  # Any branch, not just main. Two of the four legs are Windows, and this
  # project is developed on a Mac -- so pushing to a branch was the only way to
  # get a Windows result, and that path ran nothing until a PR existed. Work
  # therefore reached mainline to be verified, which is backwards: a WinPS 5.1
  # regression and a macOS-only test bug both landed on main before CI saw
  # them.
  push:
  pull_request:
    branches: [main]
  # And on demand, so a tree can be checked without any push at all.
  workflow_dispatch:

jobs:
  pester:
    name: Pester (${{ matrix.name }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: pwsh 7
            shell: pwsh
          - name: Windows PowerShell 5.1
            shell: powershell
    steps:
      - uses: actions/checkout@v5

      - name: Install Pester 5 (PSResourceGet)
        if: matrix.shell == 'pwsh'
        shell: pwsh
        run: |
          # Install-PSResource (PSResourceGet, preinstalled on windows-latest)
          # is the modern replacement for Install-Module. It handles trusted
          # repos and dependency resolution more reliably than the legacy
          # PowerShellGet v2 Install-Module, which has been flaky for
          # 'No match was found' errors against PSGallery on CI runners.
          Install-PSResource -Name Pester -Version '[5.0.0,)' -TrustRepository -Reinstall
          Import-Module Pester
          (Get-Module Pester).Version

      - name: Install Pester 5 (Windows PowerShell)
        if: matrix.shell == 'powershell'
        shell: powershell
        run: |
          # Windows PowerShell 5.1 ships Pester 3 in-box and lacks PSResourceGet,
          # so bootstrap Pester 5 via PowerShellGet v2. Force TLS 1.2 first: on
          # .NET Framework the default SecurityProtocol can omit it, and PSGallery
          # hard-refuses TLS < 1.2.
          [Net.ServicePointManager]::SecurityProtocol = `
            [Net.ServicePointManager]::SecurityProtocol -bor [Net.SecurityProtocolType]::Tls12
          Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Force | Out-Null
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name Pester -MinimumVersion 5.0.0 -Force -SkipPublisherCheck -Scope CurrentUser
          Import-Module Pester -MinimumVersion 5.0.0
          (Get-Module Pester).Version

      # NOTE: do NOT collapse these two steps into one with `shell: ${{ matrix.shell }}`.
      # The `matrix` context is not available in a step's `shell:` key, so GitHub
      # rejects it at workflow-parse time -- a startup_failure that kills the ENTIRE
      # workflow (no jobs run, both legs show red). `matrix` IS allowed in `if:`, so
      # branch on the shell there instead.
      - name: Run Pester tests (pwsh 7)
        if: matrix.shell == 'pwsh'
        shell: pwsh
        run: |
          # Pin to Pester 5 explicitly so WinPS 5.1 doesn't auto-load its in-box
          # Pester 3 (which lacks New-PesterConfiguration).
          Import-Module Pester -MinimumVersion 5.0.0
          $config = New-PesterConfiguration
          $config.Run.Path = 'tests'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $config

      - name: Run Pester tests (Windows PowerShell 5.1)
        if: matrix.shell == 'powershell'
        shell: powershell
        run: |
          Import-Module Pester -MinimumVersion 5.0.0
          $config = New-PesterConfiguration
          $config.Run.Path = 'tests'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $config

  # macOS and Linux legs. Windows Terminal does not exist here, so these
  # exercise the OSC/current-style.json apply path, the platform-specific data
  # and font directories, and the zsh/bash prompt files -- all of which the
  # Windows legs above skip entirely.
  #
  # A separate job rather than another matrix entry on `pester`: that job is
  # pinned to windows-latest and splits its steps by shell (see the note above),
  # and folding a non-Windows runner into it would mean guarding every step
  # twice over.
  pester-unix:
    name: Pester (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v5

      # zsh is preinstalled on the macOS runners but not on the Ubuntu ones.
      # Shell-Prompt.Tests.ps1 skips whichever shell is absent, so this only
      # widens coverage -- it never turns a skip into a failure.
      - name: Install zsh (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh

      - name: Install Pester 5
        shell: pwsh
        run: |
          # -Repository PSGallery explicitly: the runner images register
          # additional repositories, and resolution against the wrong one fails
          # with a bare "package: Not Found".
          Install-PSResource -Name Pester -Version '[5.0.0,)' -Repository PSGallery -TrustRepository -Reinstall
          Import-Module Pester
          (Get-Module Pester).Version

      - name: Run Pester tests
        shell: pwsh
        run: |
          Import-Module Pester -MinimumVersion 5.0.0
          $config = New-PesterConfiguration
          $config.Run.Path = 'tests'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $config
